aid: hokan
name: Hokan
description: >-
  Hokan, Inc. (株式会社hokan) is a Japanese InsurTech company that builds hokan®, a
  cloud-based customer and contract management (CRM) system for insurance agencies
  and brokerages. The platform consolidates customer and policy information, digitizes
  proposal and activity workflows, and adds modules for intent capture (意向把握),
  case management (案件管理), dashboards, accounting/cashiering (出納), and staff
  management (People). It targets paperless operations, stronger audit and compliance
  controls, renewal and aftercare tracking, and mobile access for agents. Customers
  include Orix Life, ANA, Sekisui, and other Japanese insurers and agencies. Hokan is
  backed by 500 Global. The company exposes API-based website integration for its
  product but does not publish a public developer portal, OpenAPI, or SDK; this profile
  is maintained in the API Evangelist network as a company record.
